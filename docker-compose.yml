# Dokploy "Compose" deployment: the Next.js app + a Cloudflare Tunnel.
# The app is never exposed to the host — Cloudflare reaches it over the
# private compose network, so no inbound ports need to be opened.
#
# `dokploy-network` is Dokploy's shared external network; the app and the
# migrate job join it so they can resolve the Dokploy Postgres service by name
# (e.g. progresso-io-db-...). The DATABASE_URL host must be that service name.
services:
  # Applies the Drizzle migrations, then exits. The app waits for it to finish.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - dokploy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be present at build time (inlined into the bundle).
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    restart: unless-stopped
    # Values are set in Dokploy's Environment tab and interpolated here (same
    # pattern as TUNNEL_TOKEN below). Required for auth to work:
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      # Optional (default to empty when unset):
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      # progresso: reach the Cloudflare tunnel. dokploy-network: reach the DB.
      - progresso
      - dokploy-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token of the named tunnel created in the Cloudflare Zero Trust dashboard.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - progresso

networks:
  progresso:
    driver: bridge
  dokploy-network:
    external: true
