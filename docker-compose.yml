# Dokploy "Compose" deployment: the Next.js app + a Cloudflare Tunnel.
# The app is never exposed to the host — Cloudflare reaches it over the
# private compose network, so no inbound ports need to be opened.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Values come from Dokploy's Environment tab (compose interpolates them,
      # same as TUNNEL_TOKEN below). Required:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      # Optional (default to empty when unset in Dokploy):
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    networks:
      - progresso

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token of the named tunnel created in the Cloudflare Zero Trust dashboard.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - progresso

networks:
  progresso:
    driver: bridge
