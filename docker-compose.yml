# Dokploy "Compose" deployment: the Next.js app + a Cloudflare Tunnel.
# The app is never exposed to the host — Cloudflare reaches it over the
# private compose network, so no inbound ports need to be opened.
#
# `dokploy-network` is Dokploy's shared external network; the app and the
# migrate job join it so they can resolve the Dokploy Postgres service by name
# (e.g. progresso-io-db-...). The DATABASE_URL host must be that service name.
services:
  # Applies the Drizzle migrations, then exits. The app waits for it to finish.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      # Cloudflare R2 (optional): when set, the seed uploads the base exercise
      # images to the bucket after migrating. When any is unset the upload is
      # skipped and the app falls back to the source CDN for the base images.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PREFIX=${R2_PREFIX:-}
    networks:
      - dokploy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be present at build time (inlined into the bundle).
      # The Sentry public DSN is also read at build to compute the CSP allow-list
      # (ingest host + replay worker); org/project/token drive source-map upload.
      args:
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_EXERCISE_IMAGE_BASE_URL: ${NEXT_PUBLIC_EXERCISE_IMAGE_BASE_URL:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Turnstile's site key is public, inlined into the bundle, AND read at
        # build time to open the CSP for challenges.cloudflare.com — so it has
        # to be here, not only in the runtime environment below.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: unless-stopped
    # Values are set in Dokploy's Environment tab and interpolated here (same
    # pattern as TUNNEL_TOKEN below). Required for auth to work:
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      # Observability: console logs to stdout (Docker/Dokploy captures the
      # stream). debug|info|warn|error, defaults to info in production.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Sentry: the SERVER SDK reads SENTRY_DSN at runtime. The public DSN is
      # build-inlined (see build.args) but is harmless to pass at runtime too.
      # When unset, Sentry is a no-op. Use an EU (ingest.de.sentry.io) DSN.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      # Pix for the in-app "Assinar" flow. Read at RUNTIME only (never inlined
      # into the bundle). Unset = the fatura is still raised and CONTACT_EMAIL
      # notified, just without a copia-e-cola code.
      - PIX_KEY=${PIX_KEY:-}
      - PIX_MERCHANT_NAME=${PIX_MERCHANT_NAME:-}
      - PIX_MERCHANT_CITY=${PIX_MERCHANT_CITY:-}
      # Optional (default to empty when unset):
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # Cloudflare R2 (optional): required for coaches/admin to UPLOAD custom
      # exercise images at runtime. When any is unset, the upload route answers a
      # friendly 503 and exercises can still be saved without images.
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_PREFIX=${R2_PREFIX:-}
      # AI program generator, via OpenRouter. Read at RUNTIME only (never
      # inlined into the bundle). Only the key is required: with it unset the
      # "Gerar com IA" button stays disabled and no credit is ever spent.
      # WHICH MODEL is not here — it lives in the database, edited at
      # /admin/ai, so changing it needs neither a deploy nor a restart.
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Optional; defaults to OpenRouter. See .env.example.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      # Cloudflare Turnstile: the contact form's bot check. The secret verifies
      # tokens at runtime; the site key is repeated here only so the two stay
      # visibly paired — it is the build arg above that actually reaches the
      # browser. Both unset = no widget and no verification (dev/e2e default).
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    expose:
      - "3000"
    # Container health via the app's own liveness endpoint (node has global fetch).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      # progresso: reach the Cloudflare tunnel. dokploy-network: reach the DB.
      - progresso
      - dokploy-network

  cloudflared:
    # Pinned (not `:latest`) so deploys are reproducible and a surprise upstream
    # change can't roll in unreviewed. Override/bump via the CLOUDFLARED_VERSION
    # env in Dokploy after confirming the tag; prefer a sha256 digest long-term.
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2024.12.2}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Token of the named tunnel created in the Cloudflare Zero Trust dashboard.
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - progresso

networks:
  progresso:
    driver: bridge
  dokploy-network:
    external: true
